org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Reuse the task graph between builds (warm builds go from ~50 s to a few seconds).
org.gradle.configuration-cache=true

# The Kotlin plugin's usage statistics service breaks the configuration cache when the app
# includes progeo-android-core as a build (progeo.core.dir); it only reports metrics.
kotlin.internal.collectFUSMetrics=false
